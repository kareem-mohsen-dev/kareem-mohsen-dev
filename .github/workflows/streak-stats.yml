
name: Generate GitHub Streak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kareem-mohsen-dev
          template: classic
          base: ""
          plugin_streak: yes
          filename: streak.svg

      - name: Publish Streak
        run: |
          git clone https://github.com/${{ github.repository }} repo
          cp streak.svg repo/streak.svg
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git commit -m "Update streak image" || exit 0
          git push
          
