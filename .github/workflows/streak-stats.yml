
name: Generate GitHub Streak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kareem-mohsen-dev
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_days: 365
          plugin_habits_facts: yes
          filename: streak.svg
          
